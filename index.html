<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Search Input Collector</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #eef2ff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 350px;
      padding: 25px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Search</h2>

    <!-- Replace Form action with your Formspree form link -->
    <form action="YOUR_FORMSPREE_URL" method="POST">
      <input type="text" name="search_input" placeholder="Type something and press Enter" required>
    </form>
  </div>

</body>
</html>
